<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotating CD - Open For Internship</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    .cd-stage {
      position: relative;
      width: 420px;
      height: 420px;
      perspective: 1200px;
    }

    .cd {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      transform-style: preserve-3d;
      animation: cdRotate 20s linear infinite;
      box-shadow:
        0 0 0 4px rgba(255, 255, 255, 0.06),
        0 0 60px rgba(0, 0, 0, 0.6),
        inset 0 0 40px rgba(255, 255, 255, 0.04);
    }

    .cd-face {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background-image: url('/internship-cd.jpg');
      background-size: cover;
      background-position: center;
      backface-visibility: visible;
      border: 2px solid rgba(255, 255, 255, 0.12);
    }

    .cd-ring-inner {
      position: absolute;
      top: 6%;
      left: 6%;
      width: 88%;
      height: 88%;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.10);
      pointer-events: none;
    }

    .cd-ring-outer {
      position: absolute;
      top: 3%;
      left: 3%;
      width: 94%;
      height: 94%;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.06);
      pointer-events: none;
    }

    .cd-center-hole {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #000;
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      transform: translate(-50%, -50%);
      z-index: 2;
      box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.8);
    }

    .cd-reflection {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(
        circle at 35% 35%,
        rgba(255, 255, 255, 0.08) 0%,
        rgba(255, 255, 255, 0) 40%,
        rgba(255, 255, 255, 0.04) 70%,
        transparent 100%
      );
      pointer-events: none;
      z-index: 1;
    }

    .cd-label {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 60%;
      height: 60%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      border: 2px solid rgba(255, 255, 255, 0.15);
      pointer-events: none;
      z-index: 1;
    }

    .glare {
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.12),
        transparent
      );
      animation: glareSweep 6s linear infinite;
      pointer-events: none;
      z-index: 3;
    }

    .subtitle {
      position: absolute;
      bottom: -60px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.45);
      font-size: 0.9rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      pointer-events: none;
      animation: fadeIn 3s ease-out forwards;
      opacity: 0;
    }

    @keyframes cdRotate {
      from {
        transform: rotateY(0deg) rotateX(12deg) rotateZ(5deg);
      }
      to {
        transform: rotateY(360deg) rotateX(12deg) rotateZ(5deg);
      }
    }

    @keyframes glareSweep {
      0% {
        left: -120%;
      }
      100% {
        left: 120%;
      }
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    @media (max-width: 480px) {
      .cd-stage {
        width: 280px;
        height: 280px;
      }
      .subtitle {
        bottom: -45px;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="cd-stage">
    <div class="cd">
      <div class="cd-face"></div>
      <div class="cd-ring-inner"></div>
      <div class="cd-ring-outer"></div>
      <div class="cd-center-hole"></div>
      <div class="cd-label"></div>
      <div class="cd-reflection"></div>
      <div class="glare"></div>
    </div>
    <div class="subtitle">Open For Internship &bull; Rotating CD</div>
  </div>
</body>
</html>
